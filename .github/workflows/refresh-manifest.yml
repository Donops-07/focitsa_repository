name: Refresh Search Manifest

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'Manual refresh requested'
  push:
    branches: [main]
    paths:
      - 'scripts/courses.json'

# id-token: write  → GitHub generates a signed OIDC token for this specific run.
#                    Google Cloud verifies it and issues a short-lived access pass.
#                    No JSON key is stored, pasted, or transmitted anywhere.
# contents: write  → Required to commit the updated manifest back to the repo.
permissions:
  id-token: write
  contents: write

jobs:
  crawl-and-deploy:
    name: Crawl Drive & Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub presents a signed OIDC JWT to Google Cloud STS.
      # GCP verifies it against GitHub's public JWKS, confirms this exact repo,
      # then issues a 60-min access token. No permanent key ever exists.
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # GOOGLE_APPLICATION_CREDENTIALS is set automatically by the auth step.
      # The googleapis library detects it via Application Default Credentials.
      - name: Validate crawler (dry run)
        run: npm run crawl:dry
        env:
          DRIVE_ROOT_FOLDER_ID: 1CjXTm0EW9Z9rGG_f7nfHZva4JIHvp8We

      - name: Run crawler
        run: npm run crawl
        env:
          DRIVE_ROOT_FOLDER_ID: 1CjXTm0EW9Z9rGG_f7nfHZva4JIHvp8We

      - name: Check for manifest changes
        id: diff
        run: |
          git diff --quiet public/manifest.json public/manifest.version.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit and push updated manifest
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "focitsa-kb-bot"
          git config user.email "bot@focitsa.org"
          git add -f public/manifest.json public/manifest.version.json public/crawl-report.json
          git commit -m "chore: refresh search manifest [skip ci]"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "Manifest is already up to date."

      - name: Post crawl summary
        if: always()
        run: |
          echo "## FOCITSA Knowledge Base - Crawl Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f public/crawl-report.json ]; then
            TOTAL=$(node -p "require('./public/manifest.json').length")
            FLAGGED=$(node -p "require('./public/crawl-report.json').flaggedCount")
            HASH=$(node -p "require('./public/manifest.version.json').hash")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total resources | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Flagged entries | ${FLAGGED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Manifest hash | \`${HASH}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Auth method | Workload Identity Federation (keyless) |" >> $GITHUB_STEP_SUMMARY
          fi

