<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FOCITSA Knowledge Base — search and download past questions, lecture notes, textbooks, and course outlines for the Faculty of Computing and Information Technology, UNIOSUN." />
  <meta name="theme-color" content="#0a1142" />

  <!-- Open Graph -->
  <meta property="og:title"       content="FOCITSA Knowledge Base — UNIOSUN" />
  <meta property="og:description" content="Past questions, lecture notes, textbooks, and study resources across all 7 FOCITSA departments." />
  <meta property="og:type"        content="website" />

  <title>FOCITSA Knowledge Base — UNIOSUN</title>

  <link rel="icon" type="image/jpeg" href="assets/focitsa-logo.jpg?v=2026.3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:wght@700;900&display=swap" />
  <link rel="stylesheet" href="assets/style.css?v=2026.3" />
</head>
<body>

  <!-- Institutional Top Accent Bar (Navy -> Forest Green -> Academic Gold) -->
  <div class="brand-stripe" aria-hidden="true"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand-lockup" aria-label="FOCITSA Knowledge Base Home">
        <img
          src="assets/focitsa-logo.jpg?v=2026.3"
          alt="FOCITSA UNIOSUN Crest"
          class="brand-crest"
          width="44"
          height="44"
        />
        <div class="brand-text">
          <span class="brand-title">FOCITSA Knowledge Base</span>
          <span class="brand-subtitle">Faculty of Computing &amp; Information Technology · UNIOSUN</span>
        </div>
      </a>

      <div class="header-actions">
        <span class="header-count-pill" id="header-total-badge" aria-live="polite">Indexing…</span>
        <button
          type="button"
          id="btn-copy-link"
          class="btn-share-link"
          aria-label="Copy shareable link to current filter view"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span id="copy-link-label">Copy Link</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Repository Workspace -->
  <main class="app-main">

    <!-- Search Bar -->
    <section class="search-section" aria-label="Search course materials">
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>

        <input
          type="search"
          id="search-input"
          placeholder="Search course code, title, filename, or year (e.g. CSC 202, COS 204, 2024)…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Search resources by course code, title, filename, or year"
        />

        <kbd class="search-kbd" id="search-kbd" aria-hidden="true">/</kbd>

        <button type="button" class="search-clear hidden" id="search-clear" aria-label="Clear search query">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Compact Dropdown Filter Bar -->
    <section class="filter-bar" aria-label="Filter repository">
      <select id="filter-dept" class="filter-select filter-select-dept" data-filter="dept" aria-label="Filter by department">
        <option value="">All Departments</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Cyber Security">Cyber Security</option>
        <option value="Data Science">Data Science</option>
        <option value="Information Systems">Information Systems</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Library and Information Science">Library &amp; Information Science</option>
        <option value="Software Engineering">Software Engineering</option>
      </select>

      <select id="filter-level" class="filter-select" data-filter="level" aria-label="Filter by academic level">
        <option value="">All Levels</option>
        <option value="100">100 Level</option>
        <option value="200">200 Level</option>
        <option value="300">300 Level</option>
        <option value="400">400 Level</option>
      </select>

      <select id="filter-sem" class="filter-select" data-filter="sem" aria-label="Filter by semester">
        <option value="">All Semesters</option>
        <option value="1">1st Semester</option>
        <option value="2">2nd Semester</option>
      </select>

      <select id="filter-type" class="filter-select" data-filter="type" aria-label="Filter by resource type">
        <option value="">All Types</option>
        <option value="Past Question">Past Questions</option>
        <option value="Lecture Notes">Lecture Notes</option>
        <option value="Tutorial">Tutorials</option>
        <option value="Syllabus">Syllabus</option>
        <option value="Textbook">Textbooks</option>
        <option value="Resource">General Resources</option>
      </select>

      <select id="filter-year" class="filter-select" data-filter="year" aria-label="Filter by year">
        <option value="">All Years</option>
      </select>

      <button type="button" id="btn-reset-filters" class="btn-reset-filters hidden">
        Reset Filters
      </button>
    </section>

    <!-- Status & Saved Preferences Bar -->
    <div class="status-bar" aria-live="polite">
      <div class="status-left">
        <div class="status-indicator">
          <span class="status-dot loading" id="status-dot" aria-hidden="true"></span>
          <span id="status-text">Building search index…</span>
        </div>
        <span class="saved-prefs-notice hidden" id="saved-prefs-notice"></span>
      </div>
      <div class="status-right">
        <span class="result-count" id="result-count"></span>
      </div>
    </div>

    <!-- Course-Grouped Accordion Results -->
    <div id="results-grid" class="course-groups" aria-label="Repository resources" aria-live="polite">
      <div class="skeleton-group" aria-hidden="true">
        <div class="skeleton-row">
          <div class="skel-left"><div class="skel w-24 h-5"></div><div class="skel w-64 h-4"></div></div>
          <div class="skel-right"><div class="skel w-20 h-9"></div><div class="skel w-20 h-9"></div></div>
        </div>
        <div class="skeleton-row">
          <div class="skel-left"><div class="skel w-24 h-5"></div><div class="skel w-56 h-4"></div></div>
          <div class="skel-right"><div class="skel w-20 h-9"></div><div class="skel w-20 h-9"></div></div>
        </div>
        <div class="skeleton-row">
          <div class="skel-left"><div class="skel w-24 h-5"></div><div class="skel w-60 h-4"></div></div>
          <div class="skel-right"><div class="skel w-20 h-9"></div><div class="skel w-20 h-9"></div></div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination-bar" class="pagination-bar hidden">
      <button type="button" id="btn-load-more" class="btn-load-more"></button>
    </div>

  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span>FOCITSA Academic Archive · Osun State University</span>
      <span>Materials synced daily from faculty Drive repository</span>
    </div>
  </footer>

  <!-- Full-Height Native <dialog> Document Reader Modal -->
  <dialog id="preview-modal" class="preview-dialog" aria-labelledby="modal-title">
    <div class="modal-container">

      <div class="modal-toolbar">
        <div class="modal-file-info">
          <span class="course-code" id="modal-course-code"></span>
          <span class="ext-badge" id="modal-file-ext"></span>
          <h2 id="modal-title">Document Preview</h2>
        </div>

        <div class="modal-toolbar-actions">
          <a
            id="modal-btn-drive"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-modal-action"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Open in Tab</span>
          </a>
          <a
            id="modal-btn-download"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-modal-action btn-modal-download"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Download</span>
          </a>
          <button type="button" class="modal-close" id="modal-close" aria-label="Close preview">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="modal-body">
        <iframe
          id="preview-iframe"
          src=""
          title="Document preview"
          allowfullscreen
          loading="lazy"
        ></iframe>
      </div>

    </div>
  </dialog>

  <script src="assets/app.js?v=2026.3"></script>
</body>
</html>
